<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title"><title id="title">3 · OUTCOME — status determines the available action</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1000" height="640" fill="white"/><g font-family="Nunito Sans,Arial,sans-serif"><text x="24" y="30" font-size="17" font-weight="700" fill="#1e293b">3 · OUTCOME — status determines the available action</text><rect x="280" y="60" width="440" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="296" y="85" font-size="16" font-weight="700" fill="#1e293b">U8 / D2 · Query authoritative status</text><text x="296" y="109" font-size="14" fill="#475569">Same payment intent and correlation</text><text x="296" y="130" font-size="14" fill="#475569">Bank return alone does not establish payment</text><rect x="20" y="242" width="300" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="36" y="267" font-size="16" font-weight="700" fill="#1e293b">U9 · Confirmed paid</text><text x="36" y="291" font-size="14" fill="#475569">View receipt / Back to payments</text><text x="36" y="312" font-size="14" fill="#475569">Show amount, source and recipient</text><rect x="350" y="242" width="300" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="366" y="267" font-size="16" font-weight="700" fill="#1e293b">U10 · Processing / unknown</text><text x="366" y="291" font-size="14" fill="#475569">Check this payment</text><text x="366" y="312" font-size="14" fill="#475569">No new submission while unresolved</text><rect x="680" y="242" width="300" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="696" y="267" font-size="16" font-weight="700" fill="#1e293b">U11 · Confirmed failed</text><text x="696" y="291" font-size="14" fill="#475569">Read reason and supported remedy</text><text x="696" y="312" font-size="14" fill="#475569">Correct / review again → U5</text><path d="M500 164V200H170V242" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="180" y="222" font-size="13" fill="#475569">Paid</text><path d="M500 164V242" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="512" y="222" font-size="13" fill="#475569">Pending / unknown</text><path d="M500 164V200H830V242" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="840" y="222" font-size="13" fill="#475569">Failed</text><rect x="20" y="410" width="300" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="36" y="435" font-size="16" font-weight="700" fill="#1e293b">Receipt and detail</text><text x="36" y="459" font-size="14" fill="#475569">Stable confirmation and reference</text><text x="36" y="480" font-size="14" fill="#475569">End of the completed task</text><rect x="350" y="410" width="300" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="366" y="435" font-size="16" font-weight="700" fill="#1e293b">Recheck / seek help</text><text x="366" y="459" font-size="14" fill="#475569">Retain payment reference</text><text x="366" y="480" font-size="14" fill="#475569">Update authoritative state → D2</text><rect x="680" y="410" width="300" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="696" y="435" font-size="16" font-weight="700" fill="#1e293b">Fresh required decisions</text><text x="696" y="459" font-size="14" fill="#475569">Revalidate changed details</text><text x="696" y="480" font-size="14" fill="#475569">No blind retry; prevent duplicates</text><path d="M170 346V410" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="180" y="384" font-size="13" fill="#475569">Click View receipt</text><path d="M500 346V410" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="510" y="384" font-size="13" fill="#475569">Click Check status</text><path d="M830 346V410" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="840" y="384" font-size="13" fill="#475569">Supported remedy</text><path d="M500 514V557H985V111H720" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="610" y="550" font-size="13" fill="#475569">Status response → D2</text><text x="24" y="605" font-size="14" fill="#475569">H3: distinguish known failure from uncertainty. Only confirmed settlement enables the paid state.</text></g></svg>