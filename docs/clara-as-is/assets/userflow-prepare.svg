<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title"><title id="title">1 · PREPARE — payment intent before account setup</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1000" height="840" fill="white"/><g font-family="Nunito Sans,Arial,sans-serif"><text x="24" y="30" font-size="17" font-weight="700" fill="#1e293b">1 · PREPARE — payment intent before account setup</text><rect x="24" y="60" width="430" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="85" font-size="16" font-weight="700" fill="#1e293b">U1 · New payment</text><text x="40" y="109" font-size="14" fill="#475569">Click New payment</text><text x="40" y="130" font-size="14" fill="#475569">Keep the task in Clara</text><path d="M239 164V211" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="250" y="192" font-size="13" fill="#475569">Enter details</text><rect x="24" y="211" width="430" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="236" font-size="16" font-weight="700" fill="#1e293b">U2 · Recipient + amount</text><text x="40" y="260" font-size="14" fill="#475569">Enter Pix key and amount → Find recipient</text><text x="40" y="281" font-size="14" fill="#475569">Check identity → Continue</text><path d="M239 315V362" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="250" y="343" font-size="13" fill="#475569">Valid details</text><rect x="570" y="211" width="406" height="104" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><text x="586" y="236" font-size="16" font-weight="700" fill="#1e293b">Invalid / unavailable lookup</text><text x="586" y="260" font-size="14" fill="#475569">Keep entered values</text><text x="586" y="281" font-size="14" fill="#475569">Correct fields or retry lookup → U2</text><path d="M454 263H570" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="477" y="253" font-size="13" fill="#475569">Otherwise</text><rect x="24" y="362" width="430" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="387" font-size="16" font-weight="700" fill="#1e293b">U3 · Choose source</text><text x="40" y="411" font-size="14" fill="#475569">Select the intended external account</text><text x="40" y="432" font-size="14" fill="#475569">Continue with that account</text><path d="M239 466V513" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="250" y="494" font-size="13" fill="#475569">Eligible source</text><rect x="570" y="362" width="406" height="104" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><text x="586" y="387" font-size="16" font-weight="700" fill="#1e293b">Account not eligible</text><text x="586" y="411" font-size="14" fill="#475569">Explain the specific limitation</text><text x="586" y="432" font-size="14" fill="#475569">Choose another eligible account → U3</text><path d="M454 414H570" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="477" y="404" font-size="13" fill="#475569">Otherwise</text><rect x="24" y="513" width="430" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="538" font-size="16" font-weight="700" fill="#1e293b">D1 · Is source preparation needed?</text><text x="40" y="562" font-size="14" fill="#475569">Already prepared and eligible: go to U5</text><text x="40" y="583" font-size="14" fill="#475569">First use / expired setup: follow U4</text><path d="M239 617V664" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="250" y="645" font-size="13" fill="#475569">Source ready</text><rect x="570" y="513" width="406" height="104" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-dasharray="5 4"/><text x="586" y="538" font-size="16" font-weight="700" fill="#1e293b">U4 · Bank-controlled preparation</text><text x="586" y="562" font-size="14" fill="#475569">Explain purpose → Continue to bank</text><text x="586" y="583" font-size="14" fill="#475569">Confirmed → U5; denied/canceled → U3</text><path d="M454 565H570" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="477" y="555" font-size="13" fill="#475569">Otherwise</text><rect x="24" y="664" width="430" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="689" font-size="16" font-weight="700" fill="#1e293b">U5 · Review payment</text><text x="40" y="713" font-size="14" fill="#475569">Recipient · amount · external debit account</text><text x="40" y="734" font-size="14" fill="#475569">Continue in map 2</text><text x="24" y="826" font-size="13" fill="#64748b">Proposed map · Orange branches are exceptions, not alternative money routes. U4 is a bank boundary.</text></g></svg>