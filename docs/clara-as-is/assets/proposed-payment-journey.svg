<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title"><title id="title">Proposed direct payment journey with an explicit bank boundary</title><rect width="960" height="450" fill="white"/><g font-family="Nunito Sans,Arial,sans-serif"><text x="20" y="28" fill="#334155" font-size="14" font-weight="700">PROPOSED JOURNEY · ONE PAYMENT TASK</text><g><rect x="20" y="52" width="292" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="36" y="80" font-size="13" fill="#64748b">1 · START</text><text x="36" y="111" font-size="17" font-weight="700" fill="#1e293b">Recipient + amount</text><text x="36" y="139" font-size="14" fill="#475569">Choose intended source</text></g><path d="M317 112h12m-4-4 4 4-4 4" fill="none" stroke="#64748b"/><g><rect x="334" y="52" width="292" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="350" y="80" font-size="13" fill="#64748b">2 · PREPARE</text><text x="350" y="111" font-size="17" font-weight="700" fill="#1e293b">External account</text><text x="350" y="139" font-size="14" fill="#475569">Connect only if needed</text></g><path d="M631 112h12m-4-4 4 4-4 4" fill="none" stroke="#64748b"/><g><rect x="648" y="52" width="292" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="664" y="80" font-size="13" fill="#64748b">3 · REVIEW</text><text x="664" y="111" font-size="17" font-weight="700" fill="#1e293b">Recipient · amount · source</text><text x="664" y="139" font-size="14" fill="#475569">Correct before requesting</text></g><g><rect x="20" y="210" width="292" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="36" y="238" font-size="13" fill="#64748b">4 · COMPANY DECISION</text><text x="36" y="269" font-size="17" font-weight="700" fill="#1e293b">Required approval</text><text x="36" y="297" font-size="14" fill="#475569">Identify the next actor</text></g><path d="M317 270h12m-4-4 4 4-4 4" fill="none" stroke="#64748b"/><g><rect x="334" y="210" width="292" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/><text x="350" y="238" font-size="13" fill="#64748b">5 · BANK BOUNDARY</text><text x="350" y="269" font-size="17" font-weight="700" fill="#1e293b">Authorize at the bank</text><text x="350" y="297" font-size="14" fill="#475569">Preserve request on return</text></g><path d="M631 270h12m-4-4 4 4-4 4" fill="none" stroke="#64748b"/><g><rect x="648" y="210" width="292" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="664" y="238" font-size="13" fill="#64748b">6 · TRACK</text><text x="664" y="269" font-size="17" font-weight="700" fill="#1e293b">Processing / confirmed result</text><text x="664" y="297" font-size="14" fill="#475569">Recover by known state</text></g><path d="M920 178v17H34v9m-4-4 4 4 4-4" fill="none" stroke="#94a3b8"/><text x="20" y="366" font-size="15" fill="#334155" font-weight="700">Money route A: external bank → supplier</text><text x="20" y="394" font-size="14" fill="#64748b">No prefunding in Clara · Source funds and valid authorizations still required.</text><text x="20" y="420" font-size="14" fill="#64748b">Unknown outcome → check this payment. A bank return alone does not confirm settlement.</text></g></svg>