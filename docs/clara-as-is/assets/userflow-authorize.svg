<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="689" viewBox="0 0 1000 689" role="img" aria-labelledby="title"><title id="title">2 · AUTHORIZE — preserve company policy and bank control</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1000" height="689" fill="white"/><g font-family="Nunito Sans,Arial,sans-serif"><text x="24" y="30" font-size="17" font-weight="700" fill="#1e293b">2 · AUTHORIZE — preserve company policy and bank control</text><rect x="24" y="60" width="430" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="85" font-size="16" font-weight="700" fill="#1e293b">U5 · Review + Request approval</text><text x="40" y="109" font-size="14" fill="#475569">Inspect recipient, amount and source</text><text x="40" y="130" font-size="14" fill="#475569">Click Request approval once</text><path d="M239 164V211" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="250" y="192" font-size="13" fill="#475569">Request recorded</text><rect x="570" y="60" width="406" height="104" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><text x="586" y="85" font-size="16" font-weight="700" fill="#1e293b">Edit before commitment</text><text x="586" y="109" font-size="14" fill="#475569">Edit relevant field → U2 or U3</text><text x="586" y="130" font-size="14" fill="#475569">Return to U5 and revalidate</text><path d="M454 112H570" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="477" y="102" font-size="13" fill="#475569">Otherwise</text><rect x="24" y="211" width="430" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="236" font-size="16" font-weight="700" fill="#1e293b">U6 · Company approval</text><text x="40" y="260" font-size="14" fill="#475569">Approver reviews and decides</text><text x="40" y="281" font-size="14" fill="#475569">Wait until required approvals are complete</text><path d="M239 315V362" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="250" y="343" font-size="13" fill="#475569">All required decisions recorded</text><rect x="570" y="211" width="406" height="104" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><text x="586" y="236" font-size="16" font-weight="700" fill="#1e293b">Pending / rejected</text><text x="586" y="260" font-size="14" fill="#475569">Pending: show actor and wait at U6</text><text x="586" y="281" font-size="14" fill="#475569">Rejected: reason → revise at U5</text><path d="M454 263H570" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="477" y="253" font-size="13" fill="#475569">Otherwise</text><rect x="24" y="362" width="430" height="104" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-dasharray="5 4"/><text x="40" y="387" font-size="16" font-weight="700" fill="#1e293b">U7 · Authorize at bank</text><text x="40" y="411" font-size="14" fill="#475569">Authorized representative continues to bank</text><text x="40" y="432" font-size="14" fill="#475569">Bank controls transaction authorization</text><path d="M239 466V513" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="250" y="494" font-size="13" fill="#475569">Return from bank</text><rect x="570" y="362" width="406" height="104" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><text x="586" y="387" font-size="16" font-weight="700" fill="#1e293b">Canceled / interrupted / expired</text><text x="586" y="411" font-size="14" fill="#475569">Keep intent and context</text><text x="586" y="432" font-size="14" fill="#475569">If submission is uncertain → U8</text><path d="M454 414H570" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="477" y="404" font-size="13" fill="#475569">Otherwise</text><rect x="24" y="513" width="430" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="538" font-size="16" font-weight="700" fill="#1e293b">U8 · Reconcile this payment</text><text x="40" y="562" font-size="14" fill="#475569">Correlate request and bank response</text><text x="40" y="583" font-size="14" fill="#475569">Query authoritative status → map 3</text><rect x="570" y="513" width="406" height="104" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><text x="586" y="538" font-size="16" font-weight="700" fill="#1e293b">Missing / conflicting response</text><text x="586" y="562" font-size="14" fill="#475569">Treat outcome as unknown → U10</text><text x="586" y="583" font-size="14" fill="#475569">Check this intent; do not submit again</text><path d="M454 565H570" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="477" y="555" font-size="13" fill="#475569">Otherwise</text><text x="24" y="675" font-size="13" fill="#64748b">Proposed ordering · Actual bank signatories and consent lifetime require provider validation.</text></g></svg>